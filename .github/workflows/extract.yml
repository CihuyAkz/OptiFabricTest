name: Extract ZIP and Flatten

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ada ZIP baru. Workflow selesai."
            exit 0
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted

          unzip -q "$ZIP_FILE" -d /tmp/extracted

      - name: Flatten folders
        shell: bash
        run: |
          set -e

          CURRENT="/tmp/extracted"

          while true; do
            entries=()

            while IFS= read -r -d '' item; do
              entries+=("$item")
            done < <(
              find "$CURRENT" \
                -mindepth 1 \
                -maxdepth 1 \
                ! -name ".github" \
                -print0
            )

            if [ "${#entries[@]}" -ne 1 ]; then
              break
            fi

            item="${entries[0]}"

            if [ ! -d "$item" ]; then
              break
            fi

            echo "Masuk ke folder: $item"
            CURRENT="$item"
          done

          rm -rf /tmp/final
          mkdir -p /tmp/final

          cp -a "$CURRENT"/. /tmp/final/

      - name: Clean repository
        shell: bash
        run: |
          set -e

          # Hapus semua isi repository kecuali Git dan workflow
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # Jangan bawa workflow dari ZIP
          rm -rf /tmp/final/.github

          # Copy hasil ekstraksi ke root
          cp -a /tmp/final/. .

          # Hapus SEMUA ZIP
          find . -type f \
            \( -iname "*.zip" -o -iname "*.ZIP" \) \
            -delete

      - name: Commit and Push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Auto extract ZIP"
          git push origin HEAD:main