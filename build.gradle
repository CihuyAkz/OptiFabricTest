plugins {
	id 'fabric-loom' version '1.7.4'
	id 'maven-publish'
	id 'com.gradleup.shadow' version '8.3.5'
}

// TODO(port-1.21.1, unverified): switched from Chocohead's custom Fabric-Loom fork
// (fabric-loom:2fc5f55) to the official net.fabricmc fabric-loom plugin, because the old
// fork cannot resolve Minecraft 1.21.1's multi-classifier native libraries
// (see the ':minecraftInducedLibraries' / netty-transport-native-epoll error from CI).
// This is a structural change I could not compile-test here - expect more fallout.
buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath "com.guardsquare:proguard-gradle:${JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_11) ? '7.4.0' : '7.1.0'}"
	}
}

 (including 1.21.1) requires Java 21 at runtime and to compile against.
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

configurations {
	shadow {
		transitive = false
	}
	implementation {
		extendsFrom shadow
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	shadow "net.fabricmc:tiny-remapper:${project.tiny_remapper_version}"
	modImplementation "com.github.Chocohead:Fabric-ASM:${project.fabric_asm_version}"
	include "com.github.Chocohead:Fabric-ASM:${project.fabric_asm_version}"
}

sourceSets {
	shim
	main {
		compileClasspath += shim.output
	}
}

// TODO(port-1.21.1): the old Chocohead Fabric-Loom fork had a custom `compileJava { mappings { ... } }`
// DSL to patch over named<->intermediary mapping gaps by hand. Official fabric-loom has NO such
// extension, so that whole block is gone. If compilation fails referencing an intermediary
// class/method that Yarn 1.21.1 doesn't expose under its named name, that mismatch now has to be
// solved a different way (usually: use the intermediary name directly in source, or an access
// widener). This is exactly the kind of per-class fix flagged in README-PORT.md as needing a
// real compiler + a 1.21.1 mappings browser (e.g. https://linkie.shedaniel.dev) to resolve.

task unzip(type: Copy) {
	def zipFile = file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar")
	def outputDir = file("${buildDir}/unpacked/dist")

	if(outputDir.exists()){
		outputDir.deleteDir()
	}

	from zipTree(zipFile)
	into outputDir
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
	archiveClassifier.set("sources")
	from sourceSets.main.allSource
}

jar {
	from "LICENSE"
	archiveClassifier.set('dev')
}

// TODO(port-1.21.1, unverified): plugin ID switched from the archived
// com.github.johnrengelman.shadow to its successor com.gradleup.shadow (see plugins{} block
// above); the task class package is expected to stay the same but is unconfirmed here.
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
task fatJar(type: ShadowJar, dependsOn: jar) {
	from jar.outputs.files

	archiveClassifier.set('fat')
	configurations = [project.configurations.shadow]

	relocate 'net.fabricmc.tinyremapper', 'me.modmuss50.optifabric.shadow.tinyremapper'
}

File proguardFile = file("$buildDir/libs/optifabric-${version}-shrink.jar")

import proguard.gradle.ProGuardTask
task proguardJar(type: ProGuardTask, dependsOn: fatJar) {
	inputs.files(fatJar, project.configurations.compileClasspath)
	outputs.files(proguardFile)

	doFirst {
		sourceSets.main.compileClasspath.forEach {
			//Some of the Mixin launch classes are compiled with Java 16, which ProGuard doesn't appreciate
			libraryjars([filter: '!org/spongepowered/asm/launch/**.class,!module-info.class'], it)
		}
	}

	libraryjars JavaVersion.current().java9Compatible ? "${System.getProperty('java.home')}/jmods" : "${System.getProperty('java.home')}/lib/rt.jar"

	injars fatJar.archivePath
	outjars proguardFile
	configuration file('proguard.conf')
}

// TODO(port-1.21.1, unverified): `net.fabricmc.loom.util.NestedJars` is an internal Loom class
// (not public API) used here for its GSON constant and addJars(File, List<File>) helper - both
// existed in the old fork but the exact signature in fabric-loom 1.7.4 is unconfirmed since I
// couldn't compile this. If this import or its methods don't resolve, replace GSON with your own
// `new com.google.gson.GsonBuilder().create()` and reimplement addJars by hand (it just merges a
// second jar's entries into the first inside a `META-INF/jars/` style layout Fabric Loader reads).
import org.zeroturnaround.zip.ZipUtil;
import org.zeroturnaround.zip.transform.ZipEntryTransformerEntry;
import org.zeroturnaround.zip.transform.StringZipEntryTransformer;
import java.util.zip.ZipEntry;
import net.fabricmc.loom.util.NestedJars
import com.google.gson.JsonObject
task modJar(type: Jar, dependsOn: proguardJar) {
	from zipTree(proguardFile).matching {
		exclude 'me/modmuss50/optifabric/shadow/**'
	}
	archiveClassifier.set('thin')

	doLast {
		ZipUtil.transformEntry(archivePath, new ZipEntryTransformerEntry('fabric.mod.json', new StringZipEntryTransformer() {
			@Override
			String transform(ZipEntry zipEntry, String input) {
				def json = NestedJars.GSON.fromJson(input, JsonObject.class)
				json.getAsJsonObject('depends').addProperty('optifabric-libs', "${version}")
				return NestedJars.GSON.toJson(json)
			}
		}))
	}
}

task libraryJar(type: Jar, dependsOn: proguardJar) {
	from zipTree(proguardFile).matching {
		include 'me/modmuss50/optifabric/shadow/**'
	}
	archiveClassifier.set('libs')

	doLast {
		ZipUtil.addEntry(archivePath, 'fabric.mod.json', """\
		{
			"schemaVersion": 1,
			"id": "optifabric-libs",
			"version": "${version}",
		
			"name": "OptiFabric Libraries",
			"description": "Shadowed libraries included within OptiFabric",
			"authors": [
				"Chocohead",
				"Tiny-Remapper contributors"
			],
			"contact": {
				"sources": "https://github.com/Chocohead/OptiFabric",
				"issues": "https://github.com/Chocohead/OptiFabric/issues"
			},
			"license": "LGPL-3.0",
			"environment": "client",
			"custom": {
				"modmenu:api": true,
				"modmenu": {
					"badges": ["library"]
				}
			}
		}""".stripIndent().getBytes('UTF-8'));
	}
}

remapJar {
	dependsOn 'modJar', 'libraryJar'
	input.set modJar.archivePath
	archiveClassifier.set('')

	doLast {
		NestedJars.addJars(archivePath, [libraryJar.archivePath])
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}
